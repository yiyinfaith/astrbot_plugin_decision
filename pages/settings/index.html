<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decision Engine · Tools &amp; Recommendations</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; padding: 24px; background: Canvas; color: CanvasText; }
      main { max-width: 920px; margin: 0 auto; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: color-mix(in srgb, CanvasText 70%, transparent); }
      .bar { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 12px; }
      input[type="search"] { flex: 1 1 280px; min-width: 220px; padding: 10px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, CanvasText 30%, transparent); background: Canvas; color: CanvasText; }
      button { border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; background: #4f46e5; color: white; font-weight: 600; }
      button.secondary { background: color-mix(in srgb, CanvasText 15%, Canvas); color: CanvasText; }
      #status { min-height: 22px; }
      .list { display: grid; gap: 8px; }
      label.tool { display: grid; grid-template-columns: minmax(180px, 210px) 1fr; gap: 14px; padding: 12px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 10px; }
      label.tool:hover { border-color: #6366f1; }
      .controls { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px 12px; }
      .check-option { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
      .check-option input { margin: 0; }
      .check-option small { opacity: .62; }
      .tool-info { min-width: 0; }
      .name { font-weight: 650; }
      .desc { display: block; margin-top: 4px; font-size: 13px; opacity: .72; }
      .tag { display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 999px; font-size: 11px; background: color-mix(in srgb, #6366f1 24%, Canvas); }
      .prompts { display: grid; gap: 14px; margin: 22px 0; }
      .prompt-field { display: grid; gap: 6px; }
      .prompt-field label { font-weight: 650; }
      .prompt-field small { opacity: .72; }
      textarea { width: 100%; min-height: 150px; box-sizing: border-box; resize: vertical; padding: 10px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, CanvasText 30%, transparent); background: Canvas; color: CanvasText; font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tools 过滤与推荐</h1>
      <p>普通 Tool 会由 Decision Model 逐个判断并过滤、推荐；SubAgent 始终保留，只逐个判断是否推荐。手动勾选的 Tool 可以选择“始终保留”以及是否额外推荐给主 LLM。</p>
      <div class="bar">
        <input id="search" type="search" placeholder="搜索工具名称或描述" />
        <button id="selectVisible" class="secondary">全选当前结果</button>
        <button id="clearVisible" class="secondary">取消当前结果</button>
        <button id="save">保存</button>
      </div>
      <section class="prompts">
        <div class="prompt-field">
          <label for="jevPrePrompt">Jev 判断前提示词</label>
          <small>发送给 Jev/Decision Model。不会把主 LLM 的人格 system prompt 发送给 Jev。</small>
          <textarea id="jevPrePrompt" spellcheck="false"></textarea>
        </div>
        <div class="prompt-field">
          <label for="mainLlmPostPrompt">Jev 判断后注入主 LLM 的提示词</label>
          <small>会追加到现有 system prompt 末尾；支持 {tools} 和 {subagents}，留空可关闭这段追加。</small>
          <textarea id="mainLlmPostPrompt" spellcheck="false"></textarea>
        </div>
      </section>
      <div id="status"></div>
      <div id="list" class="list">加载中…</div>
    </main>
    <script type="module">
      const bridge = window.AstrBotPluginPage;
      const list = document.getElementById("list");
      const search = document.getElementById("search");
      const status = document.getElementById("status");
      let tools = [];
      let selectedKeep = new Set();
      let selectedRecommend = new Set();
      const jevPrePrompt = document.getElementById("jevPrePrompt");
      const mainLlmPostPrompt = document.getElementById("mainLlmPostPrompt");

      function visibleTools() {
        const query = search.value.trim().toLowerCase();
        return tools.filter((tool) => !query || `${tool.name} ${tool.description}`.toLowerCase().includes(query));
      }
      function render() {
        list.replaceChildren();
        for (const tool of visibleTools()) {
          const label = document.createElement("div");
          label.className = "tool";
          const controls = document.createElement("div");
          controls.className = "controls";
          const keepLabel = document.createElement("label");
          keepLabel.className = "check-option";
          const keepCheckbox = document.createElement("input");
          keepCheckbox.type = "checkbox";
          keepCheckbox.checked = selectedKeep.has(tool.name);
          keepCheckbox.disabled = !tool.active;
          keepCheckbox.addEventListener("change", () => {
            if (keepCheckbox.checked) selectedKeep.add(tool.name);
            else {
              selectedKeep.delete(tool.name);
              selectedRecommend.delete(tool.name);
            }
            render();
          });
          keepLabel.append(keepCheckbox, document.createTextNode("始终保留"));
          const recommendLabel = document.createElement("label");
          recommendLabel.className = "check-option";
          const recommendCheckbox = document.createElement("input");
          recommendCheckbox.type = "checkbox";
          recommendCheckbox.checked = selectedRecommend.has(tool.name) && selectedKeep.has(tool.name);
          recommendCheckbox.disabled = !tool.active || tool.handoff || !keepCheckbox.checked;
          recommendCheckbox.title = tool.handoff ? "SubAgent 由逐个 Noul 自动推荐" : "仅对始终保留的 Tool 生效";
          recommendCheckbox.addEventListener("change", () => recommendCheckbox.checked ? selectedRecommend.add(tool.name) : selectedRecommend.delete(tool.name));
          recommendLabel.append(recommendCheckbox, document.createTextNode("推荐主 LLM"));
          controls.append(keepLabel, recommendLabel);
          const text = document.createElement("span");
          text.className = "tool-info";
          text.innerHTML = `<span class="name"></span>${tool.handoff ? '<span class="tag">SubAgent · 仅推荐</span>' : ''}<span class="desc"></span>`;
          text.querySelector(".name").textContent = tool.name;
          text.querySelector(".desc").textContent = tool.description + (tool.active ? "" : "（未激活）");
          label.append(controls, text);
          list.append(label);
        }
        if (!list.children.length) list.textContent = "没有匹配的工具";
      }
      search.addEventListener("input", render);
      document.getElementById("selectVisible").addEventListener("click", () => { for (const tool of visibleTools()) if (tool.active) selectedKeep.add(tool.name); render(); });
      document.getElementById("clearVisible").addEventListener("click", () => { for (const tool of visibleTools()) { selectedKeep.delete(tool.name); selectedRecommend.delete(tool.name); } render(); });
      document.getElementById("save").addEventListener("click", async () => {
        try {
          selectedRecommend = new Set([...selectedRecommend].filter((name) => selectedKeep.has(name)));
          await bridge.apiPost("settings/save", {
            always_keep_tools: [...selectedKeep],
            always_keep_recommend_tools: [...selectedRecommend],
            jev_pre_prompt: jevPrePrompt.value,
            main_llm_post_prompt: mainLlmPostPrompt.value,
          });
          status.textContent = "已保存";
        }
        catch (error) { status.textContent = `保存失败：${error.message}`; }
      });
      try {
        await bridge.ready();
        const [toolData, settings] = await Promise.all([bridge.apiGet("tools"), bridge.apiGet("settings")]);
        tools = toolData.tools || [];
        selectedKeep = new Set(settings.always_keep_tools || []);
        selectedRecommend = new Set(settings.always_keep_recommend_tools || []);
        jevPrePrompt.value = settings.jev_pre_prompt || "";
        mainLlmPostPrompt.value = settings.main_llm_post_prompt || "";
        render();
      } catch (error) { status.textContent = `加载失败：${error.message}`; list.textContent = "无法读取工具列表"; }
    </script>
  </body>
</html>
